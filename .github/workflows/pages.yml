name: GitHub Pages

# Veröffentlicht RingLabel über GitHub Pages. Auf GitHub Pages ohne eigene Domain läuft die Seite
# unter /<repo>/ – dafür setzt der Build BASE_PATH. Mit eigener Domain (Variable SITE_URL) bleibt BASE_PATH leer.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build
        run: node scripts/build.mjs
        env:
          SITE_URL: ${{ vars.SITE_URL || steps.pages.outputs.origin }}
          # Leerer String ist in Expressions „falsy“, daher nicht `vars.SITE_URL && '' || …` schreiben
          BASE_PATH: ${{ !vars.SITE_URL && steps.pages.outputs.base_path || '' }}
      - name: Build prüfen (tote Links, BASE_PATH, verbotene Begriffe, fremde Server)
        run: node scripts/check-dist.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
